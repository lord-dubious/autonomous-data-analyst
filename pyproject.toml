[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-data-analyst"
version = "1.0.0"
description = "AI-powered data analyst using Pydantic AI, Gemini, DuckDB & Streamlit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Lord Dubious", email = "lord.dubious@example.com" }
]
keywords = [
    "ai",
    "data-analysis",
    "llm",
    "gemini",
    "pydantic-ai",
    "duckdb",
    "streamlit",
    "fastapi"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = [
    "pydantic-ai[google]>=0.1.0",
    "duckdb>=1.0.0",
    "streamlit>=1.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-recording>=0.13.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/lord-dubious/autonomous-data-analyst"
Repository = "https://github.com/lord-dubious/autonomous-data-analyst"
Issues = "https://github.com/lord-dubious/autonomous-data-analyst/issues"

[project.scripts]
data-analyst = "app.streamlit_app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analyst", "app", "api"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
]

[tool.ruff.lint.isort]
known-first-party = ["data_analyst", "app", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
